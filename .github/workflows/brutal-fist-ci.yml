name: Brutal Fist CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: brutal-fist-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Rocket preview smoke test
        env:
          ROCKET_PREVIEW: "1"
        run: |
          set -euo pipefail
          npm run rocket:preview > /tmp/brutal-fist-rocket.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:8080/ -o /tmp/brutal-fist-rocket.html; then
              grep -q 'id="root"' /tmp/brutal-fist-rocket.html
              grep -q '/src/rocket-main.tsx' /tmp/brutal-fist-rocket.html
              exit 0
            fi
            sleep 1
          done
          cat /tmp/brutal-fist-rocket.log
          exit 1
