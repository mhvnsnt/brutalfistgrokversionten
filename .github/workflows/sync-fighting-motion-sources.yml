name: Sync Fighting Motion Sources

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-fighting-motion-sources.mjs'
      - 'src/engine/retarget/FightingMotionSources.ts'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Brutal Fist
        uses: actions/checkout@v4

      - name: Checkout Tekken 3 source
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: mhvnsnt/BrutalfistbaseofTekken3Recompiled
          path: vendor/BrutalfistbaseofTekken3Recompiled
          fetch-depth: 1

      - name: Checkout Schwarzer Blitz source
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: mhvnsnt/SchwarzerblitzEngine
          path: vendor/SchwarzerblitzEngine
          fetch-depth: 1

      - name: Index real motion assets
        run: node scripts/sync-fighting-motion-sources.mjs

      - name: Write human-readable motion inventory
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/generated/FightingMotionSources.generated.ts';
          const text = fs.readFileSync(path, 'utf8');
          const records = JSON.parse(text.match(/IMPORTED_FIGHTING_MOTION_SOURCES = ([\s\S]*?) as const;/)[1]);
          const animations = JSON.parse(text.match(/IMPORTED_FIGHTING_ANIMATION_SOURCES = ([\s\S]*?) as const;/)[1]);
          const lines = [
            '# Fighting Motion Source Inventory',
            '',
            `Supported source files discovered: ${records.length}`,
            `Animation-bearing source files discovered: ${animations.length}`,
            '',
          ];
          for (const source of ['tekken3-recompiled', 'schwarzer-blitz']) {
            lines.push(`## ${source}`);
            const rows = animations.filter((r) => r.source === source);
            if (!rows.length) lines.push('- No animation-bearing files were present in this checkout.');
            else for (const row of rows) lines.push(`- \`${row.path}\` (${row.extension})`);
            lines.push('');
          }
          fs.writeFileSync('fighting-motion-inventory.md', lines.join('\n'));
          NODE

      - name: Upload motion inventory and generated manifest
        uses: actions/upload-artifact@v4
        with:
          name: fighting-motion-source-inventory
          path: |
            fighting-motion-inventory.md
            src/generated/FightingMotionSources.generated.ts
          if-no-files-found: error
